<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmWatch - Premium Farm Management</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>ðŸŒ¿</text></svg>">
  
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="./css/index.css?v=14">
  <link rel="stylesheet" href="./css/components.css?v=14">
</head>
<body>
  <div id="app">
    <!-- App rendered by JS -->
  </div>
  <div id="toast-container" class="toast-container"></div>

  <!-- Entry Point with Error Catching -->
  <script type="module">
    const files = [
      './js/api.js?v=16',
      './js/auth.js?v=16',
      './js/i18n.js?v=16',
      './js/components/login.js?v=16',
      './js/components/sidebar.js?v=16',
      './js/components/dashboard.js?v=16',
      './js/components/photo-wall.js?v=16',
      './js/components/message-feed.js?v=16',
      './js/components/health-report.js?v=16',
      './js/components/progress.js?v=16',
      './js/components/daily-summary.js?v=16',
      './js/components/settings.js?v=16',
      './js/components/inventory.js?v=16',
      './js/components/deliveries.js?v=16',
      './js/components/scheduler.js?v=16',
      './js/app.js?v=16'
    ];

    async function testImports() {
      for (const file of files) {
        try {
          await import(file);
        } catch (err) {
          document.body.innerHTML = `<div style="padding:20px;color:red;background:white;z-index:9999;position:fixed;top:0;left:0;width:100%;height:100%;overflow:auto;">
            <h1>Fatal Load Error in ${file}</h1>
            <pre>${err.stack || err.message || err}</pre>
            <button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload(true);" style="margin-top:20px;padding:10px;">Clear Cache & Reload</button>
          </div>`;
          return;
        }
      }
    }
    testImports();
  </script>
</body>
</html>
